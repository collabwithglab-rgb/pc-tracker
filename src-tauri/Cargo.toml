[package]
name = "pc-tracker"
version = "0.2.2"
description = "PC Hardware & Upgrade Tracker"
authors = ["justpeppe_z"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pc_tracker_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
