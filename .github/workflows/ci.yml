name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test, TypeCheck & Privacy Audit
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Suite (285 Domain Tests)
        run: npm test -- --run

      - name: Run TypeScript Strict Typecheck
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Verify Clean Privacy Gate (Zero Personal Data)
        run: npm run audit:privacy
