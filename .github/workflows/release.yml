name: Release Desktop Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Tauri Windows x64 & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Domain Test Suite
        run: npm test -- --run

      - name: Run TypeScript Strict Typecheck
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Run Privacy & Data-Leak Audit Gate
        run: npm run audit:privacy

      - name: Validate Release Version & Synchronization
        id: version_meta
        shell: pwsh
        run: |
          $targetTag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_VERSION) {
            $env:INPUT_VERSION.Trim()
          } elseif ($env:GITHUB_REF_NAME) {
            $env:GITHUB_REF_NAME.Trim()
          } else {
            "v0.1.1"
          }
          if (-not $targetTag.StartsWith('v')) {
            $targetTag = "v$targetTag"
          }
          $rawVersion = $targetTag.TrimStart('v')

          $tauriJson = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($tauriJson.version -ne $rawVersion) {
            Write-Error "CRITICAL: Version mismatch! Release target is '$rawVersion' but src-tauri/tauri.conf.json is '$($tauriJson.version)'. Please align versions before publishing."
            exit 1
          }
          Write-Output "Release target verified: Tag $targetTag | Version $rawVersion"
          "versionTag=$targetTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "rawVersion=$rawVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Build Tauri Desktop Application (NSIS)
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "CRITICAL: TAURI_SIGNING_PRIVATE_KEY secret is missing or empty in GitHub Secrets!"
            exit 1
          }
          Write-Output "Signing key detected (length: $($env:TAURI_SIGNING_PRIVATE_KEY.Length)). Building and signing installer..."
          node ./scripts/tauri.cjs build --ci --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Calculate Checksums (SHA-256) & Generate latest.json Manifest
        id: checksums
        shell: pwsh
        run: |
          $versionTag = "${{ steps.version_meta.outputs.versionTag }}"
          $rawVersion = "${{ steps.version_meta.outputs.rawVersion }}"

          # Cerca sia nel percorso predefinito repo sia nella directory temporanea di build
          $searchDirs = @(
            "src-tauri/target/release/bundle/nsis",
            "$([System.IO.Path]::GetTempPath())pctracker-target/release/bundle/nsis",
            "$env:TEMP/pctracker-target/release/bundle/nsis"
          )

          $installer = $null
          foreach ($dir in $searchDirs) {
            if (Test-Path $dir) {
              $found = Get-Item "$dir/*$rawVersion*.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if (-not $found) {
                $found = Get-Item "$dir/*.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              }
              if ($found) {
                $installer = $found
                $targetDir = "src-tauri/target/release/bundle/nsis"
                if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }
                if ($found.DirectoryName -ne (Resolve-Path $targetDir).Path) {
                  Copy-Item -Path $found.FullName -Destination $targetDir -Force
                }
                break
              }
            }
          }

          if (-not $installer) {
            Write-Error "Installer .exe not found in bundle directories ($($searchDirs -join ', '))!"
            exit 1
          }

          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8
          Write-Output "Installer: $($installer.FullName)"
          Write-Output "SHA256: $hash"

          $sigFile = $null
          foreach ($dir in $searchDirs) {
            if (Test-Path $dir) {
              $foundSig = Get-Item "$dir/*$rawVersion*.sig" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if (-not $foundSig) {
                $foundSig = Get-Item "$dir/*.sig" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              }
              if ($foundSig) {
                $sigFile = $foundSig
                $targetDir = "src-tauri/target/release/bundle/nsis"
                if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }
                if ($foundSig.DirectoryName -ne (Resolve-Path $targetDir).Path) {
                  Copy-Item -Path $foundSig.FullName -Destination $targetDir -Force
                }
                break
              }
            }
          }

          if ($sigFile) {
            $sigContent = Get-Content -Raw -Path $sigFile.FullName
            $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            $repo = $env:GITHUB_REPOSITORY
            $safeName = $installer.Name -replace ' ', '.'
            $downloadUrl = "https://github.com/$repo/releases/download/$versionTag/$safeName"
            $latestObj = @{
              version = $rawVersion
              notes = "Aggiornamento automatico PC Tracker $versionTag"
              pub_date = $pubDate
              platforms = @{
                "windows-x86_64" = @{
                  signature = $sigContent.Trim()
                  url = $downloadUrl
                }
              }
            }
            $latestJson = $latestObj | ConvertTo-Json -Depth 5
            $latestJson | Out-File -FilePath "latest.json" -Encoding utf8
            Write-Output "Generated latest.json for auto-updater"
          } else {
            Write-Error "CRITICAL: Signature .sig file was not generated! Auto-updater will fail."
            exit 1
          }

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "PC Tracker ${{ steps.version_meta.outputs.versionTag }} (Beta)"
          tag_name: ${{ steps.version_meta.outputs.versionTag }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            SHA256SUMS.txt
            latest.json
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
